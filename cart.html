<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <title>Shopping Cart - Party Jollof</title>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🍽️</div>
        <ul class="nav-links">
            <li><a href="website.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
        <button class="order-btn" onclick="gotoMenu()">Continue Shopping</button>
    </nav>

    <section class="cart-hero">
        <h1>Your <span class="orange">Shopping Cart</span></h1>
        <p>Review your items and proceed to checkout</p>
    </section>

    <div class="cart-container">
        <div class="cart-items">
            <div class="cart-header">
                <h2>Cart Items (<span id="item-count">0</span>)</h2>
                <button class="clear-cart" onclick="clearCart()">Clear Cart</button>
            </div>
            <div class="cart-items-list">
                <!--Cart items will be inserted here-->
            </div>
        </div>

        <div class="cart-summary">
            <h2 class="summary-header">Order Summary</h2>
            <div class="summary-row">
                <span>Subtotal:</span>
                <span id="subtotal">$0.00</span>
            </div>
            <div class="summary-row">
                <span>Delivery Fee:</span>
                <span id="delivery">$5.00</span>
            </div>
            <div class="summary-row">
                <span>Tax (7.5%):</span>
                <span id="tax">$0.00</span>
            </div>

            <div class="promo-section">
                <strong>Have a promo code</strong>
                <div class="promo-input">
                    <input type="text" id="promo-code" placeholder="Enter code">
                    <button class="apply-btn" onclick="applyPromo()">Apply</button>
                </div>
            </div>

            <div class="summary-row total">
                <span>Total:</span>
                <span id="total">$0.00</span>
            </div>

            <button class="checkout-btn" id="checkout-btn" onclick="checkout()">
                Proceed to Checkout 🛒
            </button>
            <a href="menu.html" class="continue-shopping" onclick="gotoMenu()">← Continue Shopping</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
